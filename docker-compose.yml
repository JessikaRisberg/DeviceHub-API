services:
  postgres:
    image: postgres:17
    container_name: devicehub-postgres
    restart: always
    environment:
      POSTGRES_USER: devicehub
      POSTGRES_PASSWORD: devicehub_password
      POSTGRES_DB: devicehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: